[data]
start = "2016-09-30"
top_n = 5
request_interval = 0.14
minimum_days = 365

[model]
lookback = 96
# Forecast horizon in 5-minute bars (12 = 60 minutes). Longer horizons give the forecast more room
# to clear round-trip costs; changing it requires retraining.
horizon = 12
hidden = 64
layers = 2
dropout = 0.15
# 2 = daily-context features (old bundles stay on 1 and keep working).
feature_version = 2
# Attention pooling over the LSTM sequence in addition to the last hidden state.
attention = true
# Independently seeded members averaged in one ONNX file; their disagreement is the
# uncertainty output used by the runtime. Training time scales with this number.
ensemble = 3
# Member architecture: "lstm" | "gru" | "tcn" | "transformer", or a list cycled over members,
# e.g. ["lstm", "tcn", "transformer"] for a heterogeneous ensemble (more diverse errors).
# Compare candidates first: upbit-bot compare-models
architecture = "lstm"

[hmm]
states = 3
iterations = 40
restarts = 2
tolerance = 0.01
max_fit_rows = 60000
block_size = 2048
shrinkage = 100.0
threads = 4

[training]
seed = 42
epochs = 12
patience = 3
batch_size = 256
learning_rate = 0.001
weight_decay = 0.0001
# "cosine" = warmup then cosine decay per epoch; "constant" = previous behavior.
lr_schedule = "cosine"
warmup_epochs = 1
samples_per_epoch = 120000
stride = 3
validation_days = 90
test_days = 90
workers = 0
# Epoch selection: "ic" = best rank correlation of forecast vs realized return (what the
# threshold rule trades on); "mae" = previous behavior.
early_stop_metric = "ic"

[strategy]
fee_rate = 0.0005
slippage_bps = 5.0
entry_thresholds_bps = [20.0, 30.0, 45.0, 60.0, 90.0]
# Also try these upper quantiles of the validation forecasts as thresholds (scale-free).
entry_quantiles = [0.90, 0.95, 0.98, 0.99]
exit_bps = 0.0
max_hold_bars = 24
stop_loss = 0.02
take_profit = 0.04
# "limit": buys rest at the best bid for one bar and are cancelled if unfilled (no spread or
# slippage paid; the backtest fills only when the next bar trades below the bid).
# "market": previous behavior. Sells are always market orders.
entry_order = "limit"
limit_offset_bps = 0.0
# Exit when price falls this far below the best close since entry (0 = off). Locks in gains.
trailing_stop = 0.012
# Forecast-driven exits wait this many bars; stops/take-profit never wait (0 = off).
min_hold_bars = 2
# No re-entry in a market for this many bars after a stop or trailing exit (0 = off).
cooldown_bars = 6
position_fraction = 0.10
max_exposure = 0.50
daily_loss_limit = 0.03
max_drawdown = 0.10
min_order_krw = 5000.0

[gate]
min_trades = 30
min_profit_factor = 1.05
max_drawdown = 0.10

[runtime]
capital_krw = 100000.0
max_order_krw = 20000.0
max_spread_bps = 20.0
max_candle_age_seconds = 390
model_max_age_days = 30
max_errors = 3
delay_seconds = 15

# Daily parameter policy (LLM or manual). Re-validated by the runtime on every cycle.
# Risk multipliers (position/exposure/stop/daily loss) are capped at 1.0 in code:
# a policy can only reduce risk relative to the backtested values.
[policy]
enabled = true
valid_hours = 36.0
on_stale = "baseline"            # or "no_new_entries"
max_step = 0.5                   # max move per update, as a fraction of each allowed range
threshold_multiplier = [0.8, 3.0]
position_multiplier = [0.0, 1.0]
exposure_multiplier = [0.0, 1.0]
stop_loss_multiplier = [0.5, 1.0]
take_profit_multiplier = [0.5, 1.5]
hold_multiplier = [0.5, 2.0]
daily_loss_multiplier = [0.5, 1.0]
exit_bps = [-20.0, 30.0]
uncertainty_penalty = [0.0, 2.0]

[llm]
provider = "anthropic"           # "anthropic" or "openai" (any OpenAI-compatible endpoint)
model = "claude-sonnet-5-5"
api_key_env = ""                 # default: ANTHROPIC_API_KEY / OPENAI_API_KEY
base_url = ""
anthropic_version = "2023-06-01"
max_tokens = 2000
timeout_seconds = 120
min_confidence = 0.35            # below this the LLM's sizing is ignored (baseline kept)
min_sources = 3                  # skip the update when fewer data sources succeed

[macro]
crypto_sentiment = true
# Optional overrides (defaults in src/upbit_bot/macro.py):
# fred_series = { DGS10 = "US 10-year Treasury yield (%)" }
# feeds = { "Federal Reserve press releases" = "https://www.federalreserve.gov/feeds/press_all.xml" }
