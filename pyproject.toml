[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "upbit-lstm-trader"
version = "0.1.0"
description = "Local LSTM research and conservative Upbit spot execution"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<3", "requests>=2.32,<3", "PyJWT>=2.10,<3", "onnxruntime>=1.22,<2", "filelock>=3.16,<4"]

[project.optional-dependencies]
train = ["torch>=2.7,<3", "onnx>=1.17,<2"]
hmm = ["hmmlearn==0.3.3", "scikit-learn>=1.6,<2", "threadpoolctl>=3.5,<4"]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
upbit-bot = "upbit_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "RUF"]
